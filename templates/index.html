<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Farming - Crop Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">AI Crop Recommendation</h1>
      <form action="/predict" method="post" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Nitrogen (N)</label>
          <input name="N" type="number" step="any" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Phosphorus (P)</label>
          <input name="P" type="number" step="any" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Potassium (K)</label>
          <input name="K" type="number" step="any" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Temperature (°C)</label>
          <input name="temperature" type="number" step="any" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Humidity (%)</label>
          <input name="humidity" type="number" step="any" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Soil pH</label>
          <input name="ph" type="number" step="any" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Rainfall (mm)</label>
          <input name="rainfall" type="number" step="any" class="form-control" required>
        </div>

        <div class="col-12">
          <button class="btn btn-primary mt-3" type="submit">Get Recommendation</button>
        </div>
      </form>

      <footer class="mt-5 text-muted">
        Sample dataset is used for demonstration. Replace with a larger dataset for real-world use.
      </footer>
    </div>
  </body>
</html>
